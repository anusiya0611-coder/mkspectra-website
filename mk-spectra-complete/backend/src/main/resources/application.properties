server.port=8080
# Needed only if you deploy behind a proxy/load balancer (Nginx, Render, etc.) so the real client IP is used for rate limiting
server.forward-headers-strategy=framework

# ---- Gmail SMTP (values come from environment variables, never hard-code them) ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# ---- App settings ----
# Where enquiries are delivered
app.mail.to=${MAIL_TO:mkspectra27@gmail.com}
# Website origins allowed to call this API (comma separated). Add your live domain here.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}
# Spam protection: max messages per IP within the window
app.ratelimit.max=5
app.ratelimit.window-minutes=10
